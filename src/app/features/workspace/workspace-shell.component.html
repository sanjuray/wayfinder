<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="logo-mark">
        <svg width="26" height="30" viewBox="0 0 42 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 2 C9.95 2 1 10.95 1 22 C1 36 21 46 21 46 C21 46 41 36 41 22 C41 10.95 32.05 2 21 2 Z"
            fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
            style="color: var(--wf-ink)" />
          <path d="M21 11 L23 19 L31 21 L23 23 L21 31 L19 23 L11 21 L19 19 Z" fill="var(--wf-accent)" />
          <circle cx="21" cy="21" r="2.2" fill="var(--wf-bg)" />
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">wayfinder</span>
        <span class="brand-sep">·</span>
        <span class="brand-tagline">{{ tagline.current() }}</span>
      </div>
    </div>
 
    <nav class="nav">
      <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">Map</a>
      <a routerLink="/places" routerLinkActive="on">Places</a>
      <a routerLink="/collections" routerLinkActive="on">Collections</a>
      <a routerLink="/trips" routerLinkActive="on">Trips</a>
    </nav>

    <div class="topbar-right">
      <!-- (3) saved-status with hover popover -->
      <div class="save-status-wrap">
        <span class="save-status" [title]="backupStatusTooltip()">
          <span class="dot" [class.stale]="hasUnsavedChanges()"></span>
          {{ backupStatusLabel() }}
        </span>
        <div class="backup-pop" role="menu">
          <h5>Backups</h5>
 
          <!-- Backend sync row. STUB: no sync backend yet, so the action is a
               no-op and the label never claims a real sync. -->
          <button class="backup-row is-sync" type="button" (click)="syncNow()"
                  [disabled]="!auth.isLoggedIn()">
            <span class="bk-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3M3 12a9 9 0 0 0 9 9 9 9 0 0 0 6.7-3"/>
              <path d="M21 3v6h-6M3 21v-6h6"/></svg></span>
            <span class="bk-body">
              <span class="bk-t">Backend sync</span>
              <span class="bk-w">{{ syncStatusLabel() }}</span>
            </span>
            @if (auth.isLoggedIn()) { <span class="bk-go">Sync now</span> }
          </button>

          <!-- Offline JSON export row — REAL, shared with Settings. -->
          <button class="backup-row is-json" type="button" (click)="exportJson()">
            <span class="bk-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
            <span class="bk-body">
              <span class="bk-t">Offline JSON export</span>
              <span class="bk-w">{{ jsonExportLabel() }}</span>
            </span>
            <span class="bk-go">Export</span>
          </button>
        </div>
      </div>

      <!-- (4) search — now enabled, toggles the shared search state -->
      <button class="iconbtn" [class.on]="search.isOpen()" (click)="toggleSearch()"
              aria-label="Search" title="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
 
      <!-- (5) account pill + menu (logged in) OR guest cluster -->
      @if (auth.isLoggedIn()) {
        <div class="acct" [class.open]="menuOpen()">
          <button class="acct-pill" (click)="toggleMenu($event)" aria-haspopup="menu"
                  [attr.aria-expanded]="menuOpen()">
            <span class="avatar" [class.circle]="auth.isCircle()">{{ (auth.user()?.displayName || auth.user()?.email || '?')[0] }}</span>
            <span class="acct-name">{{ auth.user()?.displayName || auth.user()?.email }}</span>
            @if (auth.isCircle()) {
              <span class="plan-pill circle">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.6L21 9.2l-5 4.5L17.5 21 12 17.3 6.5 21 8 13.7l-5-4.5 6.4-.6z"/></svg>
                Circle
              </span>
            } @else {
              <span class="plan-pill">Freemium</span>
            }
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
 
          <div class="acct-menu" role="menu">
            <button class="menu-head" type="button" (click)="goToSettings()" title="Open settings">
              <span class="mh-name">{{ auth.user()?.displayName || 'Your account' }}</span>
              <span class="mh-mail">{{ auth.user()?.email }}</span>
            </button>
            <button class="menu-item" type="button" (click)="goToSettings('profile')">Profile</button>
            <button class="menu-item" type="button" (click)="goToSettings('billing')">Plan &amp; billing</button>
            <button class="menu-item" type="button" (click)="goToSettings('billing')">Plan &amp; billing</button>
            @if (!auth.isCircle()) {
              <button class="menu-item upgrade" type="button" (click)="goToSettings('billing')">Upgrade to Circle</button>
            }
            <button class="menu-item" type="button" (click)="goToSettings()">Settings</button>
            <div class="menu-sep"></div>
            <button class="menu-item danger" type="button" (click)="logout()">Log out</button>
          </div>
        </div>
      } @else {
        <span class="guest-chip"><span class="dot"></span> Guest</span>
        <a routerLink="/login" class="btn-in ghost">Log in</a>
        <a routerLink="/signup" class="btn-in">Sign up</a>
      }
    </div>
  </header>

  <div class="outlet">
    <router-outlet />
  </div>
</div>
